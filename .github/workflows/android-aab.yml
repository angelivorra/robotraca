name: Build Android AAB (TWA)

# Construye el App Bundle firmado de ROBOTRACA listo para Google Play.
#  - Manual:  Actions -> "Build Android AAB (TWA)" -> Run workflow
#  - Por tag: empuja un tag vX.Y.Z (ej. v1.0.1) y genera ademas un Release
#
# Requiere estos secrets en el repo (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    -> base64 del twa/robotraca-upload.keystore
#   ANDROID_KEYSTORE_PASSWORD  -> password del keystore (store y key)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName visible (ej. 1.0.1)"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write   # necesario para crear el Release al empujar un tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar build-tools y platform (y aceptar licencias)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;36.1.0" "platforms;android-36" "platform-tools"

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configurar Bubblewrap para usar el JDK/SDK del runner
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restaurar keystore de firma
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > twa/robotraca-upload.keystore

      - name: Calcular version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VNAME="${GITHUB_REF_NAME#v}"
          else
            VNAME="${{ github.event.inputs.version_name }}"
          fi
          VCODE="${{ github.run_number }}"
          echo "name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VNAME  versionCode=$VCODE"

      - name: Fijar version en build.gradle
        working-directory: twa
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.code }}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.ver.outputs.name }}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Construir AAB
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 'n' responde a la posible pregunta de aplicar cambios de twa-manifest.json
          printf 'n\n' | bubblewrap build --skipPwaValidation
          mv app-release-bundle.aab "robotraca-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.aab"
          ls -la *.aab

      - name: Subir AAB como artifact
        uses: actions/upload-artifact@v4
        with:
          name: robotraca-aab
          path: twa/*.aab
          if-no-files-found: error

      - name: Crear Release (solo en tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: twa/*.aab
          generate_release_notes: true
